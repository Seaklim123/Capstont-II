<!DOCTYPE html>
<html>
<head>
    <title>Backend API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        img { width: 50px; height: 50px; border-radius: 50%; margin: 5px; }
    </style>
</head>
<body>
    <h1>Testing Laravel Backend API</h1>
    <button onclick="testAPI()">Test Categories API</button>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/categories');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                let html = '<div class="result success">';
                html += '<h3>✅ API Connection Successful!</h3>';
                html += '<p><strong>Response Data:</strong></p>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.data && Array.isArray(data.data)) {
                    html += '<h4>Categories with Images:</h4>';
                    data.data.forEach(category => {
                        html += '<div style="border: 1px solid #ddd; padding: 10px; margin: 5px;">';
                        html += '<strong>' + category.name + '</strong><br>';
                        html += 'Image Path: ' + (category.image_path || 'null') + '<br>';
                        
                        if (category.image_path) {
                            // Try different URL formats
                            const urls = [
                                'http://127.0.0.1:8000' + category.image_path,
                                'http://127.0.0.1:8000/storage/' + category.image_path,
                                'http://127.0.0.1:8000/storage/categories/' + category.image_path
                            ];
                            
                            urls.forEach((url, index) => {
                                html += '<img src="' + url + '" alt="' + category.name + '" onerror="this.style.display=\'none\'" onload="console.log(\'Image loaded:\', \'' + url + '\')">';
                            });
                        }
                        html += '</div>';
                    });
                }
                
                html += '</div>';
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('API Error:', error);
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ API Connection Failed</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Make sure Laravel server is running on http://127.0.0.1:8000</p>
                    </div>
                `;
            }
        }
        
        // Auto-test when page loads
        window.onload = () => testAPI();
    </script>
</body>
</html>
